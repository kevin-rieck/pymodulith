[importlinter]
root_package = examples

[importlinter:contract:inventory-storage]
name = Other slices do not import inventory storage
type = forbidden
source_modules =
    examples.shop.orders
    examples.shop.reporting
forbidden_modules =
    examples.shop.inventory.storage
allow_indirect_imports = True

[importlinter:contract:cycles]
name = Shop siblings are acyclic
type = acyclic_siblings
ancestors =
    examples.shop
depth = 1
