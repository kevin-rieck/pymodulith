[project]
name = "pymodulith"
version = "0.1.0"
description = "Python project scaffold with pytest, ty, Ruff, and uv"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "dishka>=1.7,<2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]
